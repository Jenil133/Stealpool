<title id="title">Shared-queue / work-stealing time ratio</title>
<desc id="desc">Parallel merge sort, macOS: 8 threads 1.07, 10 threads 1.10, 12 threads 1.06, 16 threads 1.07; Parallel merge sort, Linux: 8 threads 1.03, 10 threads 0.99, 12 threads 1.09, 16 threads 0.98; Unbalanced tree reduction, default, macOS: 8 threads 1.01, 10 threads 1.03, 12 threads 1.04, 16 threads 1.02; Unbalanced tree reduction, default, Linux: 8 threads 0.99, 10 threads 1.04, 12 threads 0.98, 16 threads 1.06; Unbalanced tree reduction, fine-grained, macOS: 8 threads 7.17, 10 threads 6.81, 12 threads 6.49, 16 threads 6.58; Unbalanced tree reduction, fine-grained, Linux: 8 threads 7.87, 10 threads 9.96, 12 threads 9.39, 16 threads 10.31; Task overhead, macOS: 8 threads 17.66, 10 threads 17.21, 12 threads 16.25, 16 threads 15.01; Task overhead, Linux: 8 threads 24.39, 10 threads 34.76, 12 threads 47.26, 16 threads 84.22.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#6e7781}.title{font-size:16px;font-weight:600}.sub{font-size:12px}.tick{font-size:11px;font-variant-numeric:tabular-nums}.axis{font-size:12px}.label{font-size:12px;font-weight:600}.value{font-size:11px;font-variant-numeric:tabular-nums}.grid{stroke:#8b949e;stroke-opacity:.25;stroke-width:1}.base{stroke:#8b949e;stroke-opacity:.7;stroke-width:1}.mark8{stroke:#8b949e;stroke-opacity:.8;stroke-width:1;stroke-dasharray:4 4}</style>
